[package]
name = "dissect3d-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
thiserror = "=2.0.21"
sha2 = "=0.11.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "stream"], optional = true }
futures-util = { version = "=0.3.34", optional = true }
tokio = { version = "=1.54.1", default-features = false, features = ["io-util", "macros", "rt", "sync", "time"], optional = true }

[features]
default = []
client = ["dep:futures-util", "dep:reqwest", "dep:tokio"]

[lints]
workspace = true
