[package]
name = "dissect3d-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
sha2 = "=0.11.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "stream"], optional = true }
tokio = { version = "=1.54.1", default-features = false, features = ["macros", "rt", "time"], optional = true }

[features]
default = []
client = ["dep:reqwest", "dep:tokio"]

[lints]
workspace = true
