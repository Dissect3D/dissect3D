[workspace]
members = ["crates/api", "crates/cli", "crates/platform", "crates/engine", "crates/connection"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
version = "0.1.0-dev"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

# Codex-derived guardrails (patompong-docs/docs/engineering.md, Reference
# codebases -> codex-main; Project Rules 5-6). Configuration in clippy.toml.
[workspace.lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
disallowed_methods = "deny"
expect_used = "deny"
unwrap_used = "deny"


# Debug test workers hash their own large unoptimized binary before `hello`;
# optimized sha2 keeps that well inside the 10 s handshake bound (WE-P06/3).
[profile.dev.package.sha2]
opt-level = 3
